# Debug a failed bench harness. Brief halt/resume only; no flash operations.
bindto 127.0.0.1
gdb_port disabled
tcl_port disabled
telnet_port disabled
source [find interface/cmsis-dap.cfg]
transport select swd
set DUAL_CORE 0
source [find target/stm32wlx.cfg]
stm32wlx.cpu0 configure -event examine-end {}
adapter speed 100
reset_config none
init
halt 2000
echo [capture {reg pc}]
echo [capture {reg lr}]
echo [capture {reg xPSR}]
echo [capture {reg sp}]
echo [capture {mdw 0xe000ed28 6}]
echo [capture {mdw 0x2000fb80 32}]
resume
shutdown
