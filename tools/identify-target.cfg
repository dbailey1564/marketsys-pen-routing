# Identify the connected STM32WL target. No reset, halt, erase, or flash commands.
bindto 127.0.0.1
gdb_port disabled
tcl_port disabled
telnet_port disabled
source [find interface/cmsis-dap.cfg]
transport select swd
set DUAL_CORE 0
source [find target/stm32wlx.cfg]
# Suppress the stock examine handler's debug/watchdog register writes.
stm32wlx.cpu0 configure -event examine-end {}
adapter speed 100
reset_config none
init
echo [capture {targets}]
echo [capture {stm32wlx.cpu0 mdw 0xE0042000 1}]
shutdown
