# Read-only flash geometry/protection inspection; no reset/halt/option writes.
bindto 127.0.0.1
gdb_port disabled
tcl_port disabled
telnet_port disabled
source [find interface/cmsis-dap.cfg]
transport select swd
set DUAL_CORE 0
source [find target/stm32wlx.cfg]
stm32wlx.cpu0 configure -event examine-end {}
adapter speed 100
reset_config none
init
echo [capture {flash info 0}]
echo [capture {stm32l4x option_read 0 0x20}]
shutdown
